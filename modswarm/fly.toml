app = "graphdev-demo"
primary_region = "ewr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "graphdev_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-4x"
  memory = "4gb"
